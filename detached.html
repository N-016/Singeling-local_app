<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Singeling App</title>
    <script>
        // main.js geeft het thema mee (?theme=light|dark), zodat de balk meteen
        // in de juiste kleuren verschijnt.
        // ?soft=1: Leescomfort (zachtere kleuren), zoals de tabbalk.
        if (new URLSearchParams(location.search).get('soft') === '1') {
            document.documentElement.classList.add('theme-soft');
        }
        if (new URLSearchParams(location.search).get('theme') === 'light') {
            document.documentElement.classList.add('theme-light');
        }
    </script>
    <style>
        /* Balk bovenin een losgetrokken venster, in de stijl van de tabbalk
           (index.html): terug/vooruit/vernieuwen, de pagina als één actieve
           tab, en dezelfde eigen vensterknoppen. Geen Windows-titelbalk. */
        :root {
            color-scheme: dark;
            --accent: #ff5100;
            --bar-bg: #0f1115;
            --bar-border: #353b45;
            --tab-bg: #181b21;
            --hover: rgba(255, 255, 255, 0.06);
            --text: #f4f5f6;
            --text-muted: #9da3ac;
            --text-faint: #5f6670;
            --ease: cubic-bezier(0.2, 0, 0, 1);
            --radius: 5px;
        }

        html.theme-light {
            color-scheme: light;
            --bar-bg: #ffffff;
            --bar-border: #dfe2e6;
            --tab-bg: #ffffff;
            --hover: rgba(22, 24, 29, 0.05);
            --text: #16181d;
            --text-muted: #6b7178;
            --text-faint: #9aa0a8;
        }

        /* Leescomfort (alleen in licht): dezelfde zachtere kleuren als de
           tabbalk (index.html). */
        html.theme-light.theme-soft {
            --bar-bg: #e1e1de;
            --bar-border: #cdcdc8;
            --tab-bg: #e1e1de;
            --hover: rgba(43, 45, 49, 0.05);
            --text: #2b2d31;
            --text-muted: #62666c;
            --text-faint: #8a8e94;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: var(--bar-bg);
        }

        body {
            font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            display: flex;
            align-items: center;
            gap: 2px;
            height: 38px; /* = DETACHED_BAR_HEIGHT in main.js */
            padding: 0 0 0 6px;
            border-bottom: 1px solid var(--bar-border);
            user-select: none;
            -webkit-app-region: drag; /* venster verslepen via de balk */
            transition: background-color 0.25s var(--ease), border-color 0.25s var(--ease);
        }

        .navigation-button {
            flex: 0 0 30px;
            height: 30px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 0;
            border-radius: var(--radius);
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            -webkit-app-region: no-drag;
            transition: background-color 0.15s var(--ease), color 0.15s var(--ease), transform 0.12s var(--ease);
        }

        .navigation-button:hover:not(:disabled) {
            color: var(--text);
            background: var(--hover);
        }

        .navigation-button:active:not(:disabled) {
            transform: scale(0.88);
        }

        .navigation-button:disabled {
            color: var(--text-faint);
            cursor: not-allowed;
        }

        .navigation-button.enabled {
            color: var(--accent);
        }

        /* De pagina als één actieve tab (zelfde opmaak als .tab.active). */
        .tab {
            position: relative;
            align-self: stretch;
            display: flex;
            align-items: center;
            min-width: 0;
            max-width: 320px;
            margin-left: 6px;
            padding: 0 14px;
            font-size: 12.5px;
            font-weight: 500;
            color: var(--text);
            background-color: color-mix(in srgb, var(--accent) 13%, var(--tab-bg));
            border-left: 1px solid var(--bar-border);
            border-right: 1px solid var(--bar-border);
        }

        .tab::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 2px;
            background: var(--accent);
        }

        .tab-title {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .spacer {
            flex: 1;
            align-self: stretch;
        }

        /* ---------- Vensterknoppen (zelfde als index.html) ---------- */
        #window-controls {
            display: flex;
            align-self: stretch;
            border-left: 1px solid var(--bar-border);
            -webkit-app-region: no-drag;
        }

        .window-control {
            position: relative;
            width: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            border: 0;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            overflow: hidden;
            transition: background-color 0.15s var(--ease), color 0.15s var(--ease);
        }

        .window-control::after {
            content: '';
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 2px;
            background: var(--accent);
            transform: scaleX(0);
            transition: transform 0.25s var(--ease);
        }

        .window-control:hover {
            color: var(--text);
            background: var(--hover);
        }

        .window-control:hover::after {
            transform: scaleX(1);
        }

        .window-control svg {
            transition: transform 0.12s var(--ease);
        }

        .window-control:active svg {
            transform: scale(0.85);
        }

        /* Sluiten: oranje i.p.v. het Windows-rood, met witte kruis. */
        #window-close:hover {
            color: #fff;
            background: var(--accent);
        }

        #window-close::after {
            display: none;
        }

        #window-maximize .icon-restore,
        #window-maximize.maximized .icon-maximize {
            display: none;
        }

        #window-maximize.maximized .icon-restore {
            display: block;
        }

        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: -2px;
        }
    </style>
    <style id="chrome-theme-style"></style>
</head>
<body>
    <button type="button" class="navigation-button" id="back" title="Ga terug" aria-label="Ga terug" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
    </button>
    <button type="button" class="navigation-button" id="forward" title="Ga vooruit" aria-label="Ga vooruit" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
    </button>
    <button type="button" class="navigation-button" id="reload" title="Pagina vernieuwen" aria-label="Pagina vernieuwen">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <div class="tab"><span class="tab-title" id="title"></span></div>
    <div class="spacer"></div>
    <div id="window-controls">
        <button id="window-minimize" class="window-control" type="button" title="Minimaliseren" aria-label="Minimaliseren">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M1.5 6h9"/></svg>
        </button>
        <button id="window-maximize" class="window-control" type="button" title="Maximaliseren" aria-label="Maximaliseren">
            <svg class="icon-maximize" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="1.5" y="1.5" width="9" height="9"/></svg>
            <svg class="icon-restore" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><rect x="1.5" y="3.5" width="7" height="7"/><path d="M3.5 3.5v-2h7v7h-2"/></svg>
        </button>
        <button id="window-close" class="window-control" type="button" title="Sluiten" aria-label="Sluiten">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M2 2l8 8M10 2l-8 8"/></svg>
        </button>
    </div>
    <script>
        const backButton = document.getElementById('back');
        const forwardButton = document.getElementById('forward');
        const titleElement = document.getElementById('title');
        const maximizeButton = document.getElementById('window-maximize');

        for (const button of [backButton, forwardButton, document.getElementById('reload')]) {
            button.addEventListener('click', () => window.detachedAPI.navigate(button.id));
        }

        document.getElementById('window-minimize').addEventListener('click', () => window.detachedAPI.windowControl('minimize'));
        maximizeButton.addEventListener('click', () => window.detachedAPI.windowControl('toggle-maximize'));
        document.getElementById('window-close').addEventListener('click', () => window.detachedAPI.windowControl('close'));

        window.detachedAPI.onState(({ canGoBack, canGoForward, title }) => {
            backButton.disabled = !canGoBack;
            backButton.classList.toggle('enabled', !!canGoBack);
            forwardButton.disabled = !canGoForward;
            forwardButton.classList.toggle('enabled', !!canGoForward);
            titleElement.textContent = title || '';
            titleElement.title = title || '';
        });

        window.detachedAPI.onMaximized((maximized) => {
            maximizeButton.classList.toggle('maximized', maximized);
            maximizeButton.title = maximized ? 'Vorige grootte' : 'Maximaliseren';
            maximizeButton.setAttribute('aria-label', maximizeButton.title);
        });

        window.detachedAPI.onTheme((dark) => {
            document.documentElement.classList.toggle('theme-light', !dark);
        });

        window.detachedAPI.onSoft((soft) => {
            document.documentElement.classList.toggle('theme-soft', soft);
        });

        // Kleurenthema (themes.js): de CSS komt van main.js, '' = standaard.
        window.detachedAPI.onChromeTheme((css) => {
            document.getElementById('chrome-theme-style').textContent = css || '';
            document.documentElement.classList.toggle('chrome-theme', !!css);
        });
    </script>
</body>
</html>
