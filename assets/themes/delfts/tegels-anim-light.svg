<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMax slice">
  <!-- Delfts blauw: zeven tegels die bewegen (molens, schepen, tulpen, een bloem). Zelf gemaakt voor de Singeling App (gegenereerd). -->
  <style>
    .spin { animation: spin 9s linear infinite; }
    .sail { animation: sail 7s ease-in-out infinite alternate; }
    .sway { animation: sway 3.5s ease-in-out infinite alternate; }
    .bloom { animation: spin 16s linear infinite; }
    @media (prefers-reduced-motion: reduce) { .spin, .sail, .sway, .bloom { animation: none; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes sail { from { transform: translate(-14px, 0) rotate(-2deg); } to { transform: translate(14px, -2px) rotate(2deg); } }
    @keyframes sway { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  </style>
