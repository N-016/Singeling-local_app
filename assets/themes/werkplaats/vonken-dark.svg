<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMax slice">
  <!-- Werkplaats: het laspunt (gloed en spattende vonken). Zelf gemaakt voor de Singeling App (gegenereerd). -->
  <defs>
    <radialGradient id="wall"><stop offset="0" stop-color="#ff9a3d" stop-opacity="0.45"/><stop offset="1" stop-color="#ff9a3d" stop-opacity="0"/></radialGradient>
    <radialGradient id="hot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#ffd23f" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ff6a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .s { animation-name: fly; animation-timing-function: cubic-bezier(0.15, 0.6, 0.45, 1); animation-iteration-count: infinite; }
    @keyframes fly {
      0% { transform: translate(0, 0); opacity: 1; }
      50% { transform: translate(var(--mx), var(--my)); opacity: 0.9; }
      100% { transform: translate(var(--x), var(--y)); opacity: 0; }
    }
    .flicker { transform-origin: 1100px 832px; animation: flicker 0.32s steps(4) infinite; }
    .wallglow { animation: wallglow 0.5s steps(5) infinite; }
    @keyframes flicker {
      0%, 100% { transform: scale(1); opacity: 1; }
      25% { transform: scale(0.8); opacity: 0.75; }
      50% { transform: scale(1.15); opacity: 1; }
      75% { transform: scale(0.9); opacity: 0.85; }
    }
    @keyframes wallglow { 0%, 100% { opacity: 1; } 20% { opacity: 0.7; } 40% { opacity: 0.95; } 60% { opacity: 0.6; } 80% { opacity: 0.9; } }
    @media (prefers-reduced-motion: reduce) { .s, .flicker, .wallglow { animation: none; } .s { opacity: 0; } }
  </style>
  <ellipse class="wallglow" cx="1100" cy="792" rx="420" ry="300" fill="url(#wall)"/>
  <circle class="flicker" cx="1100" cy="832" r="46" fill="url(#hot)"/>
  <circle cx="1100" cy="832" r="6" fill="#ffffff"/>
