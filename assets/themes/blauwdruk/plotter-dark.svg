<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMax slice">
  <!-- Plotter: tekent een flensplaat. Zelf gemaakt voor de Singeling App (gegenereerd). -->
  <style>
    .p0{stroke-dasharray:1;animation:p0 24s linear infinite}
    @keyframes p0{0%,4%{stroke-dashoffset:1;opacity:0}4.01%{stroke-dashoffset:1;opacity:1}22%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
    .p1{stroke-dasharray:1;animation:p1 24s linear infinite}
    @keyframes p1{0%,25%{stroke-dashoffset:1;opacity:0}25.01%{stroke-dashoffset:1;opacity:1}29%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
    .p2{stroke-dasharray:1;animation:p2 24s linear infinite}
    @keyframes p2{0%,30%{stroke-dashoffset:1;opacity:0}30.01%{stroke-dashoffset:1;opacity:1}34%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
    .p3{stroke-dasharray:1;animation:p3 24s linear infinite}
    @keyframes p3{0%,35%{stroke-dashoffset:1;opacity:0}35.01%{stroke-dashoffset:1;opacity:1}39%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
    .p4{stroke-dasharray:1;animation:p4 24s linear infinite}
    @keyframes p4{0%,40%{stroke-dashoffset:1;opacity:0}40.01%{stroke-dashoffset:1;opacity:1}44%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
    .p5{stroke-dasharray:1;animation:p5 24s linear infinite}
    @keyframes p5{0%,47%{stroke-dashoffset:1;opacity:0}47.01%{stroke-dashoffset:1;opacity:1}55%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
    .p6{stroke-dasharray:1;animation:p6 24s linear infinite}
    @keyframes p6{0%,58%{stroke-dashoffset:1;opacity:0}58.01%{stroke-dashoffset:1;opacity:1}66%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
    .p7{stroke-dasharray:1;animation:p7 24s linear infinite}
    @keyframes p7{0%,68%{stroke-dashoffset:1;opacity:0}68.01%{stroke-dashoffset:1;opacity:1}76%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
    .t0{animation:t0 24s linear infinite}
    @keyframes t0{0%,66%{opacity:0}68%,90%{opacity:1}97%,100%{opacity:0}}
    .t1{animation:t1 24s linear infinite}
    @keyframes t1{0%,76%{opacity:0}78%,90%{opacity:1}97%,100%{opacity:0}}
    @media (prefers-reduced-motion: reduce) { .p0,.p1,.p2,.p3,.p4,.p5,.p6,.p7,.t0,.t1 { animation: none; } }
  </style>
  <defs><marker id="pa" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,3 L0,6 Z" fill="#9be7ff"/></marker></defs>
  <g fill="none" stroke="#9be7ff" stroke-width="2.4" opacity="0.8">
  <circle class="p0" pathLength="1" cx="760" cy="990" r="100"/>
  <circle class="p1" pathLength="1" cx="710.5" cy="940.5" r="14"/>
  <circle class="p2" pathLength="1" cx="809.5" cy="940.5" r="14"/>
  <circle class="p3" pathLength="1" cx="809.5" cy="1039.5" r="14"/>
  <circle class="p4" pathLength="1" cx="710.5" cy="1039.5" r="14"/>
  <circle class="p5" pathLength="1" cx="760" cy="990" r="28"/>
  <line class="p6" pathLength="1" x1="660" y1="1125" x2="860" y2="1125" marker-start="url(#pa)" marker-end="url(#pa)"/>
  <line class="p7" pathLength="1" x1="732" y1="858" x2="788" y2="858" marker-start="url(#pa)" marker-end="url(#pa)"/>
  <text class="t0" x="760" y="1118" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9be7ff" stroke="none">Ø200</text>
  <text class="t1" x="760" y="851" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#9be7ff" stroke="none">Ø56</text>
  </g>
</svg>
