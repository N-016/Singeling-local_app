<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMax slice">
  <!-- Gruvbox, jaren 70: zelf gemaakt voor de Singeling App (gegenereerd). -->
  <defs>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fabd2f"/>
      <stop offset="1" stop-color="#fe8019"/>
    </linearGradient>
    <mask id="sunStripes">
      <rect width="1920" height="1200" fill="#fff"/>
      <rect x="0" y="360" width="1920" height="8" fill="#000"/>
      <rect x="0" y="388" width="1920" height="11" fill="#000"/>
      <rect x="0" y="416" width="1920" height="14" fill="#000"/>
    </mask>
  </defs>
  <rect width="1920" height="1200" fill="#fbf1c7"/>
  <circle cx="1500" cy="330" r="120" fill="url(#sun)" mask="url(#sunStripes)"/>
  <g opacity="0.8">
  <g fill="none" stroke-width="50"><circle cx="1920" cy="1200" r="640" stroke="#cc241d"/><circle cx="1920" cy="1200" r="582" stroke="#d65d0e"/><circle cx="1920" cy="1200" r="524" stroke="#d79921"/><circle cx="1920" cy="1200" r="466" stroke="#98971a"/><circle cx="1920" cy="1200" r="408" stroke="#689d6a"/></g>
  <circle cx="1920" cy="1200" r="378" fill="#f2e5bc"/>
  </g>
</svg>
