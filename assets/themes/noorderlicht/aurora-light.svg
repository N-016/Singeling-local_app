<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1200" preserveAspectRatio="none">
  <!-- Bewegende laag overdag: zachte ochtendmist boven de bomen (themes.js laat hem verschuiven). -->
  <defs>
    <filter id="soft" x="-10%" y="-50%" width="120%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <g filter="url(#soft)" fill="#ffffff">
    <ellipse cx="500" cy="900" rx="520" ry="55" opacity="0.55"/>
    <ellipse cx="1300" cy="960" rx="640" ry="60" opacity="0.5"/>
    <ellipse cx="2000" cy="880" rx="480" ry="50" opacity="0.55"/>
    <ellipse cx="900" cy="1060" rx="700" ry="50" opacity="0.4"/>
    <ellipse cx="1900" cy="1080" rx="560" ry="45" opacity="0.35"/>
  </g>
  <g filter="url(#soft)" fill="#cfeee0" opacity="0.35">
    <ellipse cx="1200" cy="250" rx="900" ry="60"/>
  </g>
</svg>
