<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1200" preserveAspectRatio="none">
  <!-- Losse laag boven de lucht; themes.js laat hem langzaam verschuiven. -->
  <defs>
    <linearGradient id="band1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fe3b0" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#4fe3b0" stop-opacity="0.55"/>
      <stop offset="0.75" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="band2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4fe3b0" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-30%" width="120%" height="160%">
