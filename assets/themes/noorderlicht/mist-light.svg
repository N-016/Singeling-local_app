<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1200" preserveAspectRatio="none">
  <!-- Losse laag voor licht: zachte mistbanken over de boomtoppen; themes.js laat hem langzaam verschuiven. -->
  <defs>
    <linearGradient id="mist1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#f4f8fb" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mist2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf3ec" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fdf3ec" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-40%" width="120%" height="180%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>
  <g filter="url(#soft)">
    <path d="M-100 820 C 300 760, 700 880, 1100 820 S 1800 740, 2200 830 S 2500 800, 2600 810 L 2600 1000 C 2200 960, 1800 1060, 1400 990 S 600 1050, 200 1000 S -100 1020, -100 1020 Z" fill="url(#mist1)"/>
    <path d="M-100 700 C 400 660, 900 760, 1300 710 S 2100 650, 2600 720 L 2600 850 C 2100 820, 1700 890, 1200 840 S 300 880, -100 860 Z" fill="url(#mist2)"/>
    <path d="M200 930 C 600 890, 1000 990, 1400 940 S 2000 880, 2300 950 L 2300 1120 C 1900 1090, 1500 1160, 1100 1110 S 500 1150, 200 1130 Z" fill="url(#mist1)" opacity="0.7"/>
  </g>
</svg>
