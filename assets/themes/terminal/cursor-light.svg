<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMax slice">
  <!-- Terminal: knipperende cursor achter de prompt (licht). Zelf gemaakt voor de Singeling App. -->
  <style>
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
  <rect class="cursor" x="560" y="1110" width="20" height="32" fill="#56a370" fill-opacity="0.4"/>
</svg>
