<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1200" preserveAspectRatio="xMidYMax slice">
  <!-- Lichte versie van crt-dark.svg: dezelfde monitor met scanlines, maar
       een licht groen scherm met donkergroene tekst. -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.75">
      <stop offset="0" stop-color="#f6faf3"/>
      <stop offset="0.7" stop-color="#eef4ea"/>
      <stop offset="1" stop-color="#e3ecdf"/>
    </radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="#13803a" fill-opacity="0.045"/>
    </pattern>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#13803a" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1920" height="1200" fill="url(#glow)"/>
  <rect width="1920" height="1200" fill="url(#grid)"/>
  <g font-family="Consolas, 'Courier New', monospace" fill="#13803a">
    <text x="96" y="1040" font-size="34" fill-opacity="0.32">singeling@productie:~$ qrm --status</text>
    <text x="96" y="1088" font-size="34" fill-opacity="0.22">[ OK ] alle orders gesynchroniseerd</text>
    <text x="96" y="1136" font-size="34" fill-opacity="0.32">singeling@productie:~$</text>
  </g>
  <rect width="1920" height="1200" fill="url(#scan)"/>
</svg>
